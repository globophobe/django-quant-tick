// Wire fields used from QuickNode's public orderbook.proto:
// https://github.com/quiknode-labs/hypercore-grpc-examples/blob/main/proto/orderbook.proto
syntax = "proto3";
package quant_tick.quicknode;

message L4BookUpdatesRequest { repeated string coins = 1; }
message L4BookUpdatesUpdate {
  uint64 time = 1;
  uint64 height = 2;
  repeated L4OrderDiff diffs = 3;
  bool snapshot = 4;
}
message L4OrderDiff {
  uint32 diff_type = 1;
  string coin = 2;
  uint64 oid = 3;
  string user = 4;
  string side = 5;
  string px = 6;
  string sz = 7;
}
